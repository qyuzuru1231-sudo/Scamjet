<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scramjet Web App</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      align-items: center;
    }
    input {
      flex: 1;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
    }
    button {
      padding: 9px 16px;
      border-radius: 6px;
      border: none;
      background: #0284c7;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #0369a1;
    }
    .status-bar {
      padding: 6px 14px;
      font-size: 12px;
      background: #020617;
      color: #38bdf8;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }
  </style>
  <!-- BareMux & Scramjet 公式ライブラリ -->
  <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>
</head>
<body>

<div class="toolbar">
  <input type="text" id="urlInput" value="https://discord.com" placeholder="URLまたは検索ワードを入力">
  <button id="goBtn">暗号化して開く</button>
</div>
<div class="status-bar" id="status">初期化中...</div>
<iframe id="proxyFrame"></iframe>

<script>
  const statusEl = document.getElementById("status");
  const urlInput = document.getElementById("urlInput");
  const proxyFrame = document.getElementById("proxyFrame");

  let scramjet = null;

  // 現在のディレクトリパスを自動取得（raw.githack.com の /user/repo/branch/ に対応）
  const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf("/") + 1);

  async function initScramjet() {
    try {
      const { ScramjetController } = $scramjetLoadController();
      
      // プレフィックスを現在のサブディレクトリ配下に設定
      scramjet = new ScramjetController({
        files: {
          wasm: "https://unpkg.com",
          all: "https://unpkg.com",
          sync: "https://unpkg.com",
        },
        prefix: basePath + "scramjet/",
      });

      await scramjet.init();

      // Service Worker を現在のディレクトリスコープで登録
      await navigator.serviceWorker.register("./sw.js", { scope: basePath });

      // BareMux + EpoxyTransport の初期化（相対パス指定）
      const connection = new BareMux.BareMuxConnection(basePath + "baremux/worker.js");
      await connection.setTransport(
        "https://unpkg.com",
        [{ wisp: "wss://wisp.mercurywork.shop/" }]
      );

      statusEl.style.color = "#34d399";
      statusEl.textContent = "準備完了: Scramjet + EpoxyTransport が有効です";
    } catch (err) {
      statusEl.style.color = "#f87171";
      statusEl.textContent = "初期化エラー: " + err.message;
      console.error(err);
    }
  }

  function navigate() {
    if (!scramjet) {
      alert("Scramjetがまだ準備できていません。");
      return;
    }
    let query = urlInput.value.trim();
    if (!query) return;

    if (query.includes(" ") || !query.includes(".")) {
      query = "https://google.com" + encodeURIComponent(query);
    } else if (!query.startsWith("http://") && !query.startsWith("https://")) {
      query = "https://" + query;
    }

    const encodedUrl = scramjet.encodeUrl(query);
    statusEl.textContent = "暗号化通信中: " + query;
    proxyFrame.src = encodedUrl;
  }

  document.getElementById("goBtn").addEventListener("click", navigate);
  urlInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") navigate();
  });

  window.addEventListener("load", initScramjet);
</script>

</body>
</html>
